apiVersion: v1
kind: Secret
metadata:
  name: feast-data-stores
  namespace: test-ns-feast
stringData:
  redis: |
    connection_string: redis.test-ns-feast.svc.cluster.local:6379
  sql: |
    path: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres.test-ns-feast.svc.cluster.local:5432/${POSTGRES_DB}
    cache_ttl_seconds: 60
    sqlalchemy_config_kwargs:
        echo: false
        pool_pre_ping: true
---
apiVersion: feast.dev/v1
kind: FeatureStore
metadata:
  name: credit-scoring
  namespace: test-ns-feast
spec:
  # Workaround: ose-cli-rhel9 multi-arch digest for ppc64le CronJob pods
  cronJob:
    containerConfigs:
      image: "registry.redhat.io/openshift4/ose-cli-rhel9@sha256:cf5b139ba5e36e8072bbf73ae776c0b7bb46673d531403cfb64fd31859210f22"
  authz:
    noAuth: true
  feastProject: credit_scoring_local
  feastProjectDir:
    git:
      url: https://github.com/feast-dev/feast-credit-score-local-tutorial
      ref: 598a270
  services:
    offlineStore:
      persistence:
        file:
          type: duckdb
      server:
        envFrom:
        - secretRef:
            name: postgres-secret
        env:
        - name: MPLCONFIGDIR
          value: /tmp
        resources:
          requests:
            cpu: 150m
            memory: 128Mi
    onlineStore:
      persistence:
        store:
          type: redis
          secretRef:
            name: feast-data-stores
      server:
        envFrom:
        - secretRef:
            name: postgres-secret
        env:
        - name: MPLCONFIGDIR
          value: /tmp
        resources:
          requests:
            cpu: 150m
            memory: 128Mi
    registry:
      local:
        persistence:
          store:
            type: sql
            secretRef:
              name: feast-data-stores
        server:
          envFrom:
            - secretRef:
                name: postgres-secret
          restAPI: true
