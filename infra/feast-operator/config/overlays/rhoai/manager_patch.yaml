apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-manager
  namespace: system
spec:
  template:
    spec:
      containers:
      - name: manager
        args:
          - --leader-elect
          - --health-probe-bind-address=:8081
          - --metrics-bind-address=:8443
          # Defined by the downstream operator build pinned in params.env. Do
          # not drop the flag or move the mount to the controller-runtime
          # default directory to work around an image that lacks it.
          - --metrics-cert-path=/etc/metrics-certs
        securityContext:
          readOnlyRootFilesystem: true
        volumeMounts:
          - name: metrics-cert
            mountPath: /etc/metrics-certs
            readOnly: true
      volumes:
        - name: metrics-cert
          secret:
            secretName: controller-manager-metrics-tls  # pragma: allowlist secret
