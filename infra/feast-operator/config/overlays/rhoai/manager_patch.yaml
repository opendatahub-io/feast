apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-manager
  namespace: system
spec:
  template:
    spec:
      containers:
      - name: manager
        args:
          - --leader-elect
          - --health-probe-bind-address=:8081
          - --metrics-bind-address=:8443
        securityContext:
          readOnlyRootFilesystem: true
        volumeMounts:
          - name: metrics-cert
            # controller-runtime's default certificate directory. Mounting the
            # service-ca secret here needs no flag, so the overlay works with
            # every released operand image and not only the ones built with
            # --metrics-cert-path support.
            mountPath: /tmp/k8s-metrics-server/serving-certs
            readOnly: true
      volumes:
        - name: metrics-cert
          secret:
            secretName: controller-manager-metrics-tls  # pragma: allowlist secret
