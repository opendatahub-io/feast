apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-manager
  namespace: system
spec:
  template:
    spec:
      containers:
      - name: manager
        args:
          - --leader-elect
          - --health-probe-bind-address=:8081
          - --metrics-bind-address=:8443
          # 0.68.0 does not define this flag; see params.env. Do not move the
          # mount to the controller-runtime default directory to hide that skew.
          - --metrics-cert-path=/etc/metrics-certs
        securityContext:
          readOnlyRootFilesystem: true
        volumeMounts:
          - name: metrics-cert
            mountPath: /etc/metrics-certs
            readOnly: true
      volumes:
        - name: metrics-cert
          secret:
            secretName: controller-manager-metrics-tls  # pragma: allowlist secret
