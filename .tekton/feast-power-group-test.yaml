---
# Feast Power (ppc64le) Group Test Pipeline (Pipelines-as-Code)
#
# Same Feast operator + feature-server group e2e as /group-test, but provisions an
# ephemeral HyperShift HostedCluster on IBM PowerVS (ppc64le workers) instead of AWS.
#
# Triggers:
#   - Comment: /feast-power-group-test on a pull request (manual only)
#
# Pipeline definition:
#   odh-konflux-central/integration-tests/feast/pr-power-group-testing-pipeline.yaml
#
# Prerequisites:
#   - PR images built for both odh-feast-operator-ci and odh-feature-server-ci
#     (multi-arch including linux/ppc64le)
#   - Konflux/OpenShift CI PowerVS cluster profile available (see pipeline params)
#
# Required template variables (supplied by Pipelines-as-Code):
#   - revision, target_branch, pull_request_number, git_auth_secret
#
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: https://github.com/opendatahub-io/feast?rev={{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    build.appstudio.redhat.com/pull_request_number: '{{pull_request_number}}'
    pipelinesascode.tekton.dev/cancel-in-progress: "false"
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    # Manual Power e2e only — does not auto-run on group-test events.
    pipelinesascode.tekton.dev/on-comment: "^/feast-power-group-test"
  name: feast-power-group-test
  namespace: open-data-hub-tenant
  labels:
    appstudio.openshift.io/application: group-testing
    appstudio.openshift.io/component: feast-group
    pipelines.appstudio.openshift.io/type: test
spec:
  params:
  - name: group-components
    value: '{ "odh-feast-operator-ci": "opendatahub/feast-operator", "odh-feature-server-ci": "opendatahub/feature-server" }'
  # Override if Test Platform assigns a different PowerVS profile name.
  - name: cluster-profile
    value: powervs-konflux
  - name: platform
    value: powervs
  - name: hypershift-node-count
    value: "2"
  pipelineRef:
    resolver: git
    params:
    - name: url
      value: https://github.com/opendatahub-io/odh-konflux-central.git
    - name: revision
      # Point at main after pr-power-group-testing-pipeline.yaml lands on odh-konflux-central.
      # Use the feature branch while validating before merge:
      value: addFeastppc64leE2eTestRun
    - name: pathInRepo
      value: integration-tests/feast/pr-power-group-testing-pipeline.yaml
  taskRunTemplate:
    podTemplate:
      nodeSelector:
        konflux-ci.dev/workload: konflux-tenants
      tolerations:
      - effect: NoSchedule
        key: konflux-ci.dev/workload
        operator: Equal
        value: konflux-tenants
    serviceAccountName: konflux-integration-runner
  timeouts:
    pipeline: 4h0m0s
    tasks: 3h
  workspaces:
  - name: git-auth
    secret:
      secretName: '{{ git_auth_secret }}'
