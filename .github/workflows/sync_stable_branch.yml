name: Sync to Stable Branch

on:
  pull_request:
    types:
      - closed
    branches:
      - master

jobs:
  cherry-pick-to-stable:
    permissions:
      contents: write
      pull-requests: write
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ secrets.SYNC_STABLE_PAT }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_STABLE_PAT }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Cherry-pick to stable
        id: cherry-pick
        run: |
          git checkout stable

          PARENT_COUNT=$(git cat-file -p "$MERGE_SHA" | grep -c "^parent")
          if [ "$PARENT_COUNT" -gt 1 ]; then
            CHERRY_PICK_CMD="git cherry-pick -m 1 $MERGE_SHA"
          else
            COMMIT_COUNT=$(gh pr view "$PR_NUMBER" --json commits --jq '.commits | length')
            CHERRY_PICK_CMD="git cherry-pick ${MERGE_SHA}~$((COMMIT_COUNT - 1))^..${MERGE_SHA}"
          fi

          if eval "$CHERRY_PICK_CMD"; then
            git push origin stable
            echo "conflict=false" >> "$GITHUB_OUTPUT"
          else
            git cherry-pick --abort || true
            echo "conflict=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create conflict PR for manual resolution
        if: steps.cherry-pick.outputs.conflict == 'true'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          SOURCE_PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          BRANCH="auto-sync/stable/${PR_NUMBER}"
          git checkout -b "$BRANCH" origin/stable
          git commit --allow-empty -m "cherry-pick of #${PR_NUMBER} failed — manual resolution needed"
          git push origin "$BRANCH" --force

          gh pr create \
            --base stable \
            --head "$BRANCH" \
            --title "sync(stable): ${PR_TITLE} (#${PR_NUMBER}) [CONFLICT]" \
            --body "## Auto-sync from master (PR #${PR_NUMBER})

          Cherry-pick of ${SOURCE_PR_URL} **failed due to merge conflicts**.

          ### Manual resolution required
          \`\`\`bash
          git fetch origin
          git checkout -B auto-sync/stable/${PR_NUMBER} origin/stable
          git cherry-pick -m 1 ${MERGE_SHA}
          # resolve conflicts, then:
          git add .
          git cherry-pick --continue
          git push origin auto-sync/stable/${PR_NUMBER} --force
          \`\`\`"
